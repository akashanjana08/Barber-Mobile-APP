version: '3.8'

services:
  api:
    build: .
    container_name: barbercraft-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/barbercraft
      - JWT_SECRET=barbercraft_super_secret_jwt_key_2026_x89q!
      - PAYMENT_PROVIDER=mock
      - NOTIFICATION_PROVIDER=mock
      - MAPS_PROVIDER=mock
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    container_name: barbercraft-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
